<div class="page-container">
  <p>Current date: {{ currentDate }}</p>

  <select [(ngModel)]="selectedCulture">
    <option *ngFor="let culture of availableCultures" [value]="culture">{{ culture }}</option>
  </select>
  <button (click)="plantCrop()">Plant</button>

  <hr>

  <h2>Active crops</h2>
  <div *ngIf="activeCrops.length === 0">No active crops</div>
  <div class="crop-grid">
    <app-crop-card
      *ngFor="let crop of activeCrops"
      [crop]="crop"
      [currentDate]="currentDate"
      (updated)="loadCrops()">
    </app-crop-card>
  </div>
</div>
