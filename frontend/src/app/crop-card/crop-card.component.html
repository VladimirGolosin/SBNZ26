<div class="crop-card">
  <div class="card-header">
    <h2>{{ formatEnum(crop.cultureName) }}</h2>
    <div class="icons">
      <img *ngFor="let rec of crop.recommendations"
           [src]="iconMap[rec.type]"
           [matTooltip]="rec.message"
           class="rec-icon" />
    </div>
  </div>

  <div class="card-info">
    <p>Size: {{ crop.size }} m²</p>
    <p>Planted: {{ crop.plantedDate | date:'dd.MM.yyyy' }}</p>
    <p>Level: {{ crop.level }} — Status: {{ formatEnum(crop.status) }}</p>
  </div>

  <ng-container *ngIf="!readOnly">
    <div class="card-section">
      <select [(ngModel)]="selectedAction">
        <option value="" disabled selected>Select action</option>
        <option *ngFor="let action of availableActions" [value]="action">{{ formatEnum(action) }}</option>
      </select>
      <button (click)="logAction()">Log Action</button>
    </div>

    <div class="card-section">
      <select [(ngModel)]="selectedProblem">
        <option value="" disabled selected>Select problem</option>
        <option *ngFor="let problem of availableProblems" [value]="problem">{{ formatEnum(problem) }}</option>
      </select>
      <button (click)="reportProblem()">Report Problem</button>
    </div>

    <div class="card-section resolve-section" [class.hidden]="problemSolutionRecs.length === 0">
      <button *ngFor="let rec of problemSolutionRecs" (click)="resolveProblem(rec.problemName)">
        Resolve {{ formatEnum(rec.problemName!) }}
      </button>
    </div>

    <div class="card-section">
      <button [disabled]="!hasHarvestReady" (click)="collectCrop()">Collect</button>
      <button (click)="failCrop()">Mark Failed</button>
    </div>
  </ng-container>
</div>
